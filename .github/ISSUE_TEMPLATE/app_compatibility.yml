name: App compatibility
description: An app that does not install, launch or behave as on a device
labels: [app-compatibility]
body:
  - type: input
    id: app
    attributes:
      label: App
      description: Its name and bundle id, and whether it is open source (a link helps).
    validations:
      required: true
  - type: dropdown
    id: build
    attributes:
      label: Build
      options:
        - Simulator build (.app)
        - Device build (.ipa, Ad Hoc / Development / Enterprise)
        - Other
    validations:
      required: true
  - type: dropdown
    id: framework
    attributes:
      label: Made with
      options: [UIKit, SwiftUI, React Native / Expo, Flutter, Other / not sure]
  - type: textarea
    id: what
    attributes:
      label: What happens
      description: Where it fails (install, launch, a screen) and `agent-sim logs <bundle id>`.
      render: text
    validations:
      required: true
